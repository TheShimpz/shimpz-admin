[package]
name = "admin-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
license = "Apache-2.0"
description = "The Local Admin backend: the Supervisor's sign-in, session socket, chat, and the bridge to the Local Team"

[lib]
name = "admin_backend"
path = "src/lib.rs"

[[bin]]
name = "shimpz-admin"
path = "src/main.rs"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "ws", "multipart"] }
bytes = "=1.12.1"
data-encoding = "=2.11.1"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
getrandom = "=0.4.3"
hmac = "=0.13.0"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
percent-encoding = "=2.3.2"
ring = "=0.17.14"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "fs", "process"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "=0.8.4"
scrypt = { version = "=0.12.0", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
sha2 = "=0.11.0"
subtle = "=2.6.1"
tokio = { version = "=1.53.3", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["handshake"] }
unicode-normalization = "=0.1.24"
zeroize = "=1.9.1"

strict-json = { path = "../vendor/strict-json" }
team-protocol = { path = "../protocol/team/http" }

[dev-dependencies]
tempfile = "=3.27.0"
tokio = { version = "=1.53.3", features = ["test-util"] }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "unwind"

[profile.dev.package."*"]
opt-level = 3
